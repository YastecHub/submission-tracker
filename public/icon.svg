<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nexiumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="nexiumGold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="nexiumGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="nexiumGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded purple background (iOS-friendly corner radius) -->
  <rect width="512" height="512" rx="110" fill="url(#nexiumBg)"/>
  <rect width="512" height="512" rx="110" fill="url(#nexiumGlow)"/>

  <!-- Left leaf -->
  <g transform="translate(256 220) rotate(-22)">
    <path d="M 0 10
             C -70 -20 -95 -90 -75 -150
             C -30 -135 0 -70 0 10 Z"
          fill="url(#nexiumGold)"
          stroke="#78350f" stroke-width="4"/>
    <path d="M -5 5 C -35 -50 -55 -100 -70 -140"
          fill="none" stroke="#78350f" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- Right leaf -->
  <g transform="translate(256 220) rotate(22)">
    <path d="M 0 10
             C 70 -20 95 -90 75 -150
             C 30 -135 0 -70 0 10 Z"
          fill="url(#nexiumGoldLight)"
          stroke="#78350f" stroke-width="4"/>
    <path d="M 5 5 C 35 -50 55 -100 70 -140"
          fill="none" stroke="#78350f" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- Capsule (two halves, tilted) -->
  <g transform="translate(256 320) rotate(-22)">
    <!-- Dark half -->
    <path d="M -70 -22
             A 22 22 0 0 0 -70 22
             L -4 22
             L -4 -22 Z"
          fill="#b45309" stroke="#78350f" stroke-width="3"/>
    <!-- Light half -->
    <path d="M 4 -22
             L 70 -22
             A 22 22 0 0 1 70 22
             L 4 22 Z"
          fill="url(#nexiumGoldLight)" stroke="#78350f" stroke-width="3"/>
    <!-- Highlight streak on light half -->
    <rect x="10" y="-14" width="50" height="5" rx="2" fill="#fef3c7" opacity="0.6"/>
  </g>

  <!-- Powder specks spilling from the capsule -->
  <g fill="#fef3c7">
    <circle cx="230" cy="365" r="4"/>
    <circle cx="215" cy="380" r="3"/>
    <circle cx="240" cy="385" r="2.5"/>
    <circle cx="200" cy="360" r="2.5"/>
    <circle cx="222" cy="395" r="2"/>
  </g>
</svg>
